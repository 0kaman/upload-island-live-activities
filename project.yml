name: UploadIsland
options:
  bundleIdPrefix: com.demo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  UploadIsland:
    type: application
    platform: iOS
    sources:
      - UploadIsland
      - Shared
    dependencies:
      - target: UploadIslandWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.demo.UploadIsland
        PRODUCT_NAME: UploadIsland
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Upload Island
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
  UploadIslandWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: UploadIslandWidget
        excludes:
          - Info.plist
      - Shared
    info:
      path: UploadIslandWidget/Info.plist
      properties:
        CFBundleDisplayName: Upload Island Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.demo.UploadIsland.Widget
        PRODUCT_NAME: UploadIslandWidget
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  UploadIsland:
    build:
      targets:
        UploadIsland: all
    run:
      config: Debug
